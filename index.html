function migrate(s){
 if((s.v||1)<2){
  DEFAULT.spells.forEach(sp=>{if(!s.spells.some(x=>x.name===sp.name))s.spells.push(clone(sp));});
  const dd=s.spells.find(x=>x.dyn==='dd');if(dd)dd.src='elf';
  s.v=2;
 }
 return s;
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(merge(clone(DEFAULT),JSON.parse(r)));}catch(e){storageOK=false;}return clone(DEFAULT);}

/* ============ derived ============ */
function recalc(){
 const L=S.levels.length;const cnt=c=>S.levels.filter(l=>l.cls===c).length;
 const sorc=cnt('S'),lock=cnt('W');
 const pb=2+Math.floor((Math.max(L,1)-1)/4);
 const sc={},md={};
 ABIL.forEach(a=>{sc[a]=num(S.abilities[a].base)+num(S.racial[a])+num(S.abilities[a].bonus);md[a]=Math.floor((sc[a]-10)/2);});
 const tier=L>=17?4:L>=11?3:L>=5?2:1;
 // HP
 let hp=0;const hpParts=[];
 S.levels.forEach((lv,i)=>{const d=CLS[lv.cls].die;let base,how;
  if(i===0){base=d;how='max';}else if(lv.roll!=null&&lv.roll!==''){base=num(lv.roll);how='rolled';}else{base=d/2+1;how='avg';}
  const g=Math.max(1,base+md.con);hp+=g;hpParts.push(`L${i+1} ${CLS[lv.cls].name} d${d}: ${base} (${how}) ${fmt(md.con)} CON = ${g}`);});
 const bonus=num(S.hpBonus);if(bonus)hpParts.push(`Other HP bonus ${fmt(bonus)}`);
 const maxHP=hp+bonus;
 if(S.hp==null)S.hp=maxHP;S.hp=Math.min(Math.max(0,S.hp),maxHP);
 // AC
 const ac=acCalc(md,lock);
 const dc=8+pb+md.cha,atk=pb+md.cha;
 const slots=sorc>=1?SORC_SLOTS[Math.min(sorc,20)]:[];
 C={L,sorc,lock,pb,sc,md,tier,maxHP,hpParts,ac,dc,atk,slots,pact:PACT(lock),spMax:sorc>=2?sorc:0,
  dcElf:8+pb+md.int,atkElf:pb+md.int};
}
function acCalc(md,lock){
 const a=ARMOR.find(x=>x.id===S.armor)||ARMOR[0];const parts=[];let v,warn='';
 if(a.id==='none'){
  if(S.mageArmor){v=13+md.dex;parts.push('Mage Armor 13',`DEX ${fmt(md.dex)}`);}
  else{v=10+md.dex;parts.push('Unarmored 10',`DEX ${fmt(md.dex)}`);}
 }else{
  let d=a.dex==='full'?md.dex:a.dex==='max2'?Math.min(md.dex,2):0;
  v=a.base+d;parts.push(`${a.name.split(' (')[0]} ${a.base}`);if(a.dex!=='none')parts.push(`DEX ${fmt(d)}${a.dex==='max2'?' (max 2)':''}`);
  const prof=a.cat==='light'||a.cat==='medium'?lock>=1:false;
  if(!prof)warn='Not proficient in this armor: no spellcasting, disadvantage on STR/DEX checks, saves and attacks.';
  if(S.mageArmor)parts.push('(Mage Armor has no effect while armored)');
 }
 if(S.shield){v+=2;parts.push('Shield +2');if(lock<1&&!warn)warn='Not proficient with shields.';}
 if(S.shieldSpell){v+=5;parts.push('Shield spell +5');}
 if(num(S.acBonus)){v+=num(S.acBonus);parts.push(`Other ${fmt(num(S.acBonus))}`);}
 return{v,parts,warn};
}
function skillMod(k,ab){const p=S.skills[k]||0;return C.md[ab]+p*C.pb;}
function weaponProf(w){
 if(w.preset&&WPRESET[w.preset]){
  if(C.lock>=1)return true;
  return SORC_WEAPONS.includes(w.preset)||ELF_WEAPONS.includes(w.preset);
 }return !!w.profManual;
}
function wAbility(w){
 if(w.hex&&C.lock>=1&&!w.twoH)return'cha';
 if(w.kind==='ranged')return'dex';
 if(w.finesse)return C.md.dex>=C.md.str?'dex':'str';
 return'str';
}

 const dyn=sp.dyn?`<p><b>At your level:</b> ${dynText(sp.dyn)}</p>`:'';
 const fx=sp.fx==='shield'?`<button class="btn sm${S.shieldSpell?' on':''}" data-act="fx" data-k="shieldSpell">${S.shieldSpell?'Active (+5 AC)':'Mark active'}</button>`:sp.fx==='mage'?`<button class="btn sm${S.mageArmor?' on':''}" data-act="fx" data-k="mageArmor">${S.mageArmor?'Active (AC 13+DEX)':'Mark active'}</button>`:'';
 return`<details class="spell" data-sid="${sp.id}" ${UI.open[sp.id]?'open':''}><summary><span class="sn">${esc(sp.name)}</span>${sp.conc?'<i class="tag">C</i>':''}<span class="sm">${esc(meta)}</span></summary><div class="sbody">${info}<p>${esc(sp.text)}</p>${dyn}<div class="srow"><button class="btn sm gold" data-act="cast" data-id="${sp.id}">${sp.level?'Cast':'Use'}</button>${fx}<button class="btn sm danger" data-act="delSpell" data-id="${sp.id}">Remove</button></div></div></details>`;
}

function metaCard(){
 const allowed=META_KNOWN(C.sorc),known=METAMAGIC.filter(m=>S.metaKnown.includes(m.id));
 let h=`<div class="card"><h2>Metamagic</h2>`;
 if(!allowed){return h+`<p class="hint">Unlocks at Sorcerer 3.</p></div>`;}
 h+=`<p class="hint">Known ${known.length} / ${allowed} · Sorcery points ${C.spMax-S.used.sp} / ${C.spMax}. ${META_NOTE}</p>`;
 known.forEach(m=>{h+=`<div class="feat"><div class="h"><b>${esc(m.name)}</b><span class="meta">${m.cost==='X'?'X points':m.cost+' pt'+(m.cost>1?'s':'')}</span></div><div class="meta" style="color:var(--text)">${esc(m.text)}</div><div class="srow" style="margin-top:6px"><button class="btn sm gold" data-act="useMeta" data-id="${m.id}">Use</button></div></div>`;});
 if(!known.length)h+=`<p class="hint">No options chosen yet.</p>`;
 return h+`<div style="margin-top:8px"><button class="btn gold" data-act="pickMeta">Choose options</button></div></div>`;
}
function tabFeatures(){
 let h=metaCard();
 const groups=[['S','Sorcerer · Shadow Magic',C.sorc],['W','Warlock · Hexblade',C.lock],['R','High Elf',0]];
 groups.forEach(([c,title,lv])=>{
  h+=`<div class="card"><h2>${title}</h2>`;
  if(c==='W'&&!lv)h+=`<p class="hint">Not taken yet. These unlock when you add the Warlock level.</p>`;
  FEATURES.filter(f=>f.cls===c).forEach(f=>{
   const locked=f.lvl>lv&&c!=='R'?true:(c==='R'?false:f.lvl>lv);
   const use=f.use&&!locked?`<div class="pips">${pips(f.use,1,S.used[f.use])}</div>`:'';
   h+=`<div class="feat${locked?' locked':''}"><div class="h"><b>${esc(f.name)}</b><span class="meta">${c==='R'?'Race':'Level '+f.lvl}${locked?' · locked':''}</span></div><div class="meta" style="color:var(--text)">${esc(f.text)}</div>${use?`<div style="margin-top:6px">${use}<span class="meta"> resets: ${f.reset}</span></div>`:''}</div>`;
  });
  h+=`</div>`;
 });
 h+=`<div class="card"><h2>Feats</h2>`+(S.feats.length?S.feats.map(f=>`<div class="feat"><div class="h"><b>${esc(f.name)}</b><button class="btn sm danger" data-act="delFeat" data-id="${f.id}">Remove</button></div><div class="meta" style="color:var(--text)">${esc(f.text)}</div></div>`).join(''):'<p class="hint">No feats.</p>')+`<div style="margin-top:8px"><button class="btn gold" data-act="addFeat">+ Add feat</button></div></div>`;
 return h;
}

function tabGear(){
 let h=`<div class="card"><h2>Armor</h2><label>Armor worn</label><select data-bind="armor">${ARMOR.map(a=>`<option value="${a.id}"${S.armor===a.id?' selected':''}>${a.name}</option>`).join('')}</select>
 <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:end"><div><label>Shield (+2)</label><input type="checkbox" data-bind="shield" ${S.shield?'checked':''}></div><div><label>Other AC bonus</label><input type="number" data-bind="acBonus" data-t="n" value="${num(S.acBonus)}"></div></div>
 <p class="hint" style="margin-top:8px">AC is ${C.ac.v}: ${C.ac.parts.join(' + ')}. ${C.ac.warn?`<span style="color:var(--red)">${C.ac.warn}</span>`:''}</p></div>`;
 h+=`<div class="card"><h2>Weapons</h2>`;
 if(!S.weapons.length)h+=`<p class="hint">No weapons.</p>`;
 S.weapons.forEach((w,i)=>{
  const canHex=C.lock>=1&&!w.twoH;
  h+=`<div class="row"><div><div class="t">${esc(w.name)}${num(w.bonus)?` ${fmt(num(w.bonus))}`:''}</div><div class="s">${esc(w.dmg)} ${esc(w.type)} · ${w.cat}${w.finesse?' · finesse':''}${w.twoH?' · two-handed':''}${w.kind==='ranged'?' · ranged':''}</div></div>
  <div class="srow">${canHex?`<button class="btn sm${w.hex?' on':''}" data-act="hexW" data-i="${i}">${w.hex?'Hex Warrior bound':'Bind (Hex Warrior)'}</button>`:''}<button class="btn sm danger" data-act="delW" data-i="${i}">Remove</button></div></div>`;
 });
 h+=`<div style="margin-top:8px"><button class="btn gold" data-act="addW">+ Add weapon</button></div><p class="hint" style="margin-top:8px">Hex Warrior (CHA for attack and damage) needs a weapon you are proficient with and that is not two-handed. You bind a new one at the end of each long rest.</p></div>`;
 h+=`<div class="card"><h2>Inventory</h2>`;
 S.inventory.forEach((it,i)=>{h+=`<div class="row"><input data-bind="inventory.${i}.name" value="${esc(it.name)}" style="flex:1"><input type="number" data-bind="inventory.${i}.qty" data-t="n" value="${num(it.qty)}" style="width:70px"><button class="btn sm danger" data-act="delItem" data-i="${i}">×</button></div>`;});
 h+=`<div style="margin-top:8px"><button class="btn gold" data-act="addItem">+ Add item</button></div></div>`;
 h+=`<div class="card"><h2>Coins</h2><div class="grid4" style="grid-template-columns:repeat(5,1fr)">${['cp','sp','ep','gp','pp'].map(c=>`<div><label>${c.toUpperCase()}</label><input type="number" data-bind="coins.${c}" data-t="n" value="${num(S.coins[c])}"></div>`).join('')}</div></div>`;
 return h;

function tabChar(){
 let h=`<div class="card"><h2>Identity</h2><label>Name</label><input data-bind="name" value="${esc(S.name)}">
 <div class="two"><div><label>Background</label><input data-bind="background" value="${esc(S.background)}"></div><div><label>Alignment</label><input data-bind="alignment" value="${esc(S.alignment)}"></div>
 <div><label>Speed (ft)</label><input type="number" data-bind="speed" data-t="n" value="${num(S.speed)}"></div><div><label>Other max HP bonus</label><input type="number" data-bind="hpBonus" data-t="n" value="${num(S.hpBonus)}"></div></div>
 <label>Languages</label><input data-bind="languages" value="${esc(S.languages)}"></div>`;
 // warnings
 const w=[];
 if(C.sorc>=1&&C.lock>=1&&C.sc.cha<13)w.push('Multiclassing into Sorcerer and Warlock requires CHA 13 (your total is '+C.sc.cha+').');
 if(C.L>20)w.push('Character level above 20.');
 const sk=S.spells.filter(s=>s.src==='sorc');
 if(sk.filter(s=>s.level===0).length>SORC_CANT(C.sorc))w.push('More Sorcerer cantrips than allowed.');
 if(sk.filter(s=>s.level>0).length>SORC_KNOWN[Math.min(C.sorc,20)])w.push('More Sorcerer spells known than allowed.');
 if(S.metaKnown.length>META_KNOWN(C.sorc))w.push('More Metamagic options known than allowed.');
 if(C.ac.warn)w.push(C.ac.warn);
 if(w.length)h+=`<div class="card warn"><h2>Check</h2><ul>${w.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
 // abilities
 h+=`<div class="card"><h2>Ability scores</h2><p class="hint">Enter your rolled scores in Base. Race is a free field (it starts at +2 DEX, +1 INT, the High Elf default): set it to whatever your DM allows. Use Other for ASIs and magic items.</p><table><tr><th class="l"></th><th>Base</th><th>Race</th><th>Other</th><th>Total</th><th>Mod</th></tr>`;
 ABIL.forEach(a=>{h+=`<tr><td class="l"><b>${ABN[a]}</b></td><td><input type="number" data-bind="abilities.${a}.base" data-t="n" value="${num(S.abilities[a].base)}"></td><td><input type="number" data-bind="racial.${a}" data-t="n" value="${num(S.racial[a])}"></td><td><input type="number" data-bind="abilities.${a}.bonus" data-t="n" value="${num(S.abilities[a].bonus)}"></td><td><b>${C.sc[a]}</b></td><td><b>${fmt(C.md[a])}</b></td></tr>`;});
 h+=`</table></div>`;
 // levels
 h+=`<div class="card"><h2>Levels</h2><p class="hint">Level 1 takes the maximum hit die. For later levels enter the rolled value, or leave empty for the average.</p>`;
 S.levels.forEach((lv,i)=>{const d=CLS[lv.cls].die;h+=`<div class="row"><div><div class="t">${i+1}. ${CLS[lv.cls].name} (${CLS[lv.cls].sub})</div><div class="s">d${d}</div></div>${i===0?`<b>${d} (max)</b>`:`<input type="number" data-bind="levels.${i}.roll" data-t="nn" placeholder="avg ${d/2+1}" value="${lv.roll==null?'':lv.roll}" style="width:90px">`}</div>`;});
 h+=`<div class="srow" style="margin-top:10px"><button class="btn gold" data-act="addLevel"${C.L>=20?' disabled':''}>+ Level up</button><button class="btn danger" data-act="delLevel"${C.L<=1?' disabled':''}>Remove last level</button></div></div>`;
 // saves / skills
 h+=`<div class="card"><h2>Skills</h2><p class="hint">Tap the dot to cycle: none, proficient, expertise. Sorcerer picks 2 of Arcana, Deception, Insight, Intimidation, Persuasion, Religion; Perception comes from Keen Senses.</p>`;
 SKILLS.forEach(([k,n,ab])=>{const p=S.skills[k]||0;h+=`<div class="row" style="padding:4px 0"><div><button class="btn sm${p?' on':''}" data-act="skill" data-k="${k}" style="min-width:34px">${p===2?'◉':p===1?'●':'○'}</button> ${n} <span class="s">(${ABN[ab]})</span></div><b>${fmt(skillMod(k,ab))}</b></div>`;});
 h+=`<div class="row"><div class="t">Passive Perception</div><b>${10+skillMod('perception','wis')}</b></div><div class="row"><div class="t">Darkvision</div><b>${C.sorc>=1?'120 ft':'60 ft'}</b></div></div>`;
 h+=`<div class="card"><h2>Proficiencies</h2><div class="meta" style="color:var(--text)"><b>Armor:</b> ${C.lock>=1?'Light, medium, shields':'None'}<br><b>Weapons:</b> ${C.lock>=1?'Simple and martial':'Daggers, darts, slings, quarterstaffs, light crossbows, longswords, shortswords, shortbows, longbows'}<br><b>Saves:</b> CON, CHA</div><label>Tools and other proficiencies</label><input data-bind="tools" value="${esc(S.tools)}"><label>Metamagic known</label><div class="meta" style="color:var(--text)">${S.metaKnown.length?esc(METAMAGIC.filter(m=>S.metaKnown.includes(m.id)).map(m=>m.name).join(', ')):'None'} (manage in the Features tab)</div></div>`;
 h+=`<div class="card"><h2>Notes</h2><textarea data-bind="notes">${esc(S.notes)}</textarea></div>`;
 h+=`<div class="card"><h2>Data</h2><p class="hint">Changes are saved automatically in this browser. Export a backup now and then.</p><div class="srow"><button class="btn gold" data-act="export">Export backup</button><button class="btn" data-act="import">Import backup</button><button class="btn danger" data-act="reset">Reset sheet</button></div></div>`;
 return h;
}

/* ============ modal + toast ============ */
function modal(title,body,buttons){
 $('#modal').innerHTML=`<div class="mb" data-act="closeModal"></div><div class="mc card"><h3>${title}</h3><div>${body}</div><div class="mbtns">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-mbtn="${i}">${b.label}</button>`).join('')}</div></div>`;
 $('#modal').className='open';MODAL={buttons};
}
function closeModal(){$('#modal').className='';$('#modal').innerHTML='';MODAL=null;}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';},3800);}
const val=id=>{const e=$('#'+id);return e?e.value:'';};

/* ============ actions ============ */
const ACT={
 tab(el){S.tab=el.dataset.t;UI.tip=null;save();render();window.scrollTo(0,0);},
 tip(el){UI.tip=UI.tip===el.dataset.k?null:el.dataset.k;render();},
 closeModal(){closeModal();},
 pip(el){const k=el.dataset.k;const mx=maxOf(k);let u=usedGet(k);if(el.classList.contains('on'))u=Math.min(mx,u+1);else u=Math.max(0,u-1);usedSet(k,u);commit();},
 death(el){const k=el.dataset.k,i=+el.dataset.i;S.death[k]=S.death[k]===i+1?i:i+1;commit();},
 dropConc(){S.conc='';commit();},
 toggleCursed(){S.cursed=!S.cursed;commit();},
 fx(el){S[el.dataset.k]=!S[el.dataset.k];commit();},
 skill(el){const k=el.dataset.k;S.skills[k]=((S.skills[k]||0)+1)%3;commit();},
 theme(){S.theme=S.theme==='dark'?'light':'dark';commit();},
 conds(){modal('Conditions',`<div class="two">${CONDITIONS.map(c=>`<label style="display:flex;gap:8px;align-items:center;color:var(--text);font-size:14px"><input type="checkbox" class="cond" value="${c}" ${S.conditions.includes(c)?'checked':''}>${c}</label>`).join('')}</div>`,[{label:'Save',cls:'gold',fn(){S.conditions=[...document.querySelectorAll('.cond:checked')].map(x=>x.value);commit();}}]);},
 hd(el){const d=+el.dataset.d,key='hd'+d,tot=d===6?C.sorc:C.lock;if((S.used[key]||0)>=tot){toast('No d'+d+' left');return;}const r=roll(d);const heal=Math.max(0,r+C.md.con);S.used[key]=(S.used[key]||0)+1;S.hp=Math.min(C.maxHP,S.hp+heal);toast(`d${d}: ${r} ${fmt(C.md.con)} CON → healed ${heal}`);commit();},
 useExtra(el){const n=el.dataset.n;S.extra[n]=Math.max(0,(S.extra[n]||0)-1);commit();},
 flex(){
  const maxN=Math.min(5,Math.max(...(C.slots.map((m,i)=>m?i+1:0))));
  let body=`<p class="hint">Sorcery points: ${C.spMax-S.used.sp} / ${C.spMax}</p><div class="optlist">`;
  for(let n=1;n<=Math.min(5,maxN);n++)body+=`<button class="btn" data-mbtn="${'c'+n}">Create a level ${n} slot (${FLEX_COST[n]} points)</button>`;
  body+=`<hr style="border-color:var(--line);width:100%">`;
  for(let n=1;n<=9;n++){const left=(C.slots[n-1]||0)-(S.used.slots[n]||0);if(left>0)body+=`<button class="btn" data-mbtn="${'s'+n}">Burn a level ${n} slot for ${n} points</button>`;}
  if(C.pact&&C.pact.n-S.used.pact>0)body+=`<button class="btn" data-mbtn="p">Burn a Pact slot (level ${C.pact.l}) for ${C.pact.l} points</button>`;
  body+='</div>';
  modal('Flexible Casting',body,[{label:'Close'}]);
  MODAL.flex=true;
 },
 pickMeta(){
  const allowed=META_KNOWN(C.sorc);
  const body=`<p class="hint">Choose up to ${allowed}.</p>`+METAMAGIC.map(m=>`<label style="display:block;color:var(--text);margin:6px 0"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="mm" value="${m.id}" ${S.metaKnown.includes(m.id)?'checked':''}><b>${esc(m.name)}</b> <span class="meta">(${m.cost==='X'?'X':m.cost} pt)</span></span><span class="meta" style="display:block;margin-left:26px">${esc(m.text)}</span></label>`).join('');
  modal('Metamagic',body,[{label:'Cancel'},{label:'Save',cls:'gold',fn(){const v=[...document.querySelectorAll('.mm:checked')].map(x=>x.value);if(v.length>allowed){toast('You can know only '+allowed+' options');return false;}S.metaKnown=v;commit();}}]);},
 useMeta(el){
  const m=METAMAGIC.find(x=>x.id===el.dataset.id);if(!m)return;
  const left=C.spMax-S.used.sp;
  const spend=c=>{if(c>left){toast('Not enough sorcery points ('+left+' left)');return false;}S.used.sp+=c;toast(`${m.name}: ${c} sorcery point${c>1?'s':''} spent`);commit();};
  if(m.cost==='X'){modal(esc(m.name),`<p class="hint">Sorcery points left: ${left}. Cost equals the spell’s level (1 for a cantrip).</p><label>Spell level</label><input type="number" id="m_x" min="1" max="9" value="1">`,[{label:'Cancel'},{label:'Spend',cls:'gold',fn(){return spend(Math.max(1,num(val('m_x'))));}}]);}
  else modal(esc(m.name),`<p>Spend <b>${m.cost}</b> sorcery point${m.cost>1?'s':''}? (${left} left)</p>`,[{label:'Cancel'},{label:'Spend',cls:'gold',fn(){return spend(m.cost);}}]);
 },
 damage(){modal('Damage',`<label>Amount</label><input type="number" id="m_amt" min="0" value="" autofocus><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="m_sp"> Radiant damage or a critical hit</label>`,[{label:'Cancel'},{label:'Apply',cls:'danger',fn(){const a=num(val('m_amt'));const sp=$('#m_sp').checked;if(a>0)applyDamage(a,sp);}}]);},
 heal(){modal('Heal',`<label>Amount</label><input type="number" id="m_amt" min="0" value=""><label>Temp HP (replaces the current value only if higher)</label><input type="number" id="m_tmp" min="0" value="">`,[{label:'Cancel'},{label:'Apply',cls:'gold',fn(){const a=num(val('m_amt'));const t=num(val('m_tmp'));if(a>0){if(S.hp===0){S.death={s:0,f:0};}S.hp=Math.min(C.maxHP,S.hp+a);}if(t>S.temp)S.temp=t;commit();}}]);},
 rest(){modal('Rest',`<p class="hint">Short rest: Pact slots and Hexblade’s Curse come back${C.sorc>=20?', plus 4 sorcery points':''}. Spend hit dice from Resources.<br>Long rest: HP, all slots, sorcery points and uses restored, half your hit dice regained.</p>`,[{label:'Cancel'},{label:'Short rest',fn(){S.used.pact=0;S.used.curse=0;if(C.sorc>=20)S.used.sp=Math.max(0,S.used.sp-4);toast('Short rest done');commit();}},{label:'Long rest',cls:'gold',fn(){longRest();}}]);},
 addLevel(){
  modal('Level up',`<label>New level in</label><select id="m_cls"><option value="S">Sorcerer (Shadow Magic)</option><option value="W">Warlock (Hexblade)</option></select><label>Hit points rolled (leave empty for the average)</label><input type="number" id="m_roll" min="1">`,[{label:'Cancel'},{label:'Add level',cls:'gold',fn(){
   const cls=val('m_cls');const r=val('m_roll');const before=C.maxHP;
   S.levels.push({cls,roll:r===''?null:num(r)});recalc();S.hp+=C.maxHP-before;
   const cl=S.levels.filter(l=>l.cls===cls).length;const nf=featuresAt(cls,cl);
   toast(`Level ${C.L}: ${CLS[cls].name} ${cl}. ${nf.length?'New: '+nf.join(', '):'No tracked feature at this level; check the book.'}`);commit();}}]);},
 delLevel(){modal('Remove last level',`<p>Remove level ${C.L} (${CLS[S.levels[C.L-1].cls].name})? Slots and HP will be recalculated.</p>`,[{label:'Cancel'},{label:'Remove',cls:'danger',fn(){S.levels.pop();recalc();commit();}}]);},
 addSpell(){modal('Add spell',`<label>Name</label><input id="m_n"><div class="two"><div><label>Level (0 = cantrip)</label><input type="number" id="m_l" min="0" max="9" value="1"></div><div><label>Source</label><select id="m_s"><option value="sorc">Sorcerer</option><option value="lock">Warlock</option><option value="elf">High Elf (INT)</option><option value="free">Other</option></select></div>
  <div><label>Casting time</label><input id="m_c" value="1 action"></div><div><label>Range</label><input id="m_r"></div><div><label>Components</label><input id="m_k"></div><div><label>Duration</label><input id="m_d"></div></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="m_cc"> Concentration</label><label>Description</label><textarea id="m_t"></textarea>`,[{label:'Cancel'},{label:'Add',cls:'gold',fn(){const n=val('m_n').trim();if(!n){toast('Name required');return false;}S.spells.push({id:uid(),name:n,level:Math.min(9,Math.max(0,num(val('m_l')))),src:val('m_s'),school:'',cast:val('m_c'),range:val('m_r'),comp:val('m_k'),dur:val('m_d'),conc:$('#m_cc').checked,text:val('m_t')});commit();}}]);},
 delSpell(el){const sp=S.spells.find(s=>s.id===el.dataset.id);if(!sp)return;modal('Remove spell',`<p>Remove ${esc(sp.name)}?</p>`,[{label:'Cancel'},{label:'Remove',cls:'danger',fn(){S.spells=S.spells.filter(s=>s.id!==sp.id);commit();}}]);},
 cast(el){
  const sp=S.spells.find(s=>s.id===el.dataset.id);if(!sp)return;
  const finish=(msg)=>{if(sp.fx==='mage')S.mageArmor=true;if(sp.fx==='shield')S.shieldSpell=true;if(sp.conc)S.conc=sp.name;toast(msg);commit();};
  if(sp.level===0){finish(sp.name+(sp.conc?' (concentration)':''));return;}
  const opts=[];
  for(let n=sp.level;n<=9;n++){const mx=C.slots[n-1]||0,left=mx-(S.used.slots[n]||0);if(mx&&left>0)opts.push({label:`Sorcerer slot, level ${n} (${left} left)${n>sp.level?' · upcast':''}`,fn(){S.used.slots[n]=(S.used.slots[n]||0)+1;finish(`${sp.name} cast with a level ${n} slot`);}});}
  if(C.pact&&C.pact.l>=sp.level&&C.pact.n-S.used.pact>0)opts.push({label:`Pact slot, level ${C.pact.l} (${C.pact.n-S.used.pact} left)`,fn(){S.used.pact++;finish(`${sp.name} cast with a Pact slot`);}});
  Object.keys(S.extra).forEach(n=>{if(+n>=sp.level&&S.extra[n]>0)opts.push({label:`Created slot, level ${n} (${S.extra[n]})`,fn(){S.extra[n]--;finish(`${sp.name} cast with a created slot`);}});});
  opts.push({label:'No slot (ritual or free cast)',fn(){finish(sp.name);}});
  modal('Cast '+esc(sp.name),'<p class="hint">Choose the slot to spend.</p>',[{label:'Cancel',cls:'danger'}].concat(opts.slice().reverse()));
 },
 addW(){
  const presets=Object.keys(WPRESET).map(k=>`<option value="${k}">${WPRESET[k].name}</option>`).join('');
  modal('Add weapon',`<label>Preset</label><select id="m_p"><option value="">Custom</option>${presets}</select><label>Name</label><input id="m_n"><div class="two"><div><label>Damage dice</label><input id="m_d" value="1d8"></div><div><label>Damage type</label><input id="m_t" value="slashing"></div><div><label>Magic bonus</label><input type="number" id="m_b" value="0"></div><div><label>Type</label><select id="m_k"><option value="melee">Melee</option><option value="ranged">Ranged</option></select></div></div>
  <div class="two"><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="m_f"> Finesse</label><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="m_2"> Two-handed</label><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="m_pr"> I am proficient (custom only)</label></div>`,
  [{label:'Cancel'},{label:'Add',cls:'gold',fn(){const p=val('m_p');const n=val('m_n').trim()||(p?WPRESET[p].name:'');if(!n){toast('Name required');return false;}
   S.weapons.push({id:uid(),preset:p||'',name:n,dmg:val('m_d')||'1d4',type:val('m_t'),kind:val('m_k'),finesse:$('#m_f').checked,twoH:$('#m_2').checked,cat:p?WPRESET[p].cat:'custom',bonus:num(val('m_b')),hex:false,profManual:$('#m_pr').checked});commit();}}]);},
 addFeat(){modal('Add feat',`<label>Name</label><input id="m_n"><label>Description</label><textarea id="m_t"></textarea>`,[{label:'Cancel'},{label:'Add',cls:'gold',fn(){const n=val('m_n').trim();if(!n){toast('Name required');return false;}S.feats.push({id:uid(),name:n,text:val('m_t')});commit();}}]);},
 delFeat(el){S.feats=S.feats.filter(f=>f.id!==el.dataset.id);commit();},
 delW(el){S.weapons.splice(+el.dataset.i,1);commit();},
 hexW(el){const i=+el.dataset.i;const was=S.weapons[i].hex;S.weapons.forEach(w=>w.hex=false);S.weapons[i].hex=!was;commit();},
 addItem(){S.inventory.push({name:'New item',qty:1});commit();},
 delItem(el){S.inventory.splice(+el.dataset.i,1);commit();},
 export(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='inei-amenokage-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);},
 import(){$('#importFile').click();},
 reset(){modal('Reset sheet','<p>This deletes everything saved in this browser and restores the starting sheet. Export a backup first if unsure.</p>',[{label:'Cancel'},{label:'Reset',cls:'danger',fn(){S=clone(DEFAULT);commit();}}]);}
};

function applyDamage(a,special){
 let rem=a;if(S.temp>0){const t=Math.min(S.temp,rem);S.temp-=t;rem-=t;}
 const prev=S.hp;let msg='';
 if(rem>0&&prev===0){S.death.f=Math.min(3,S.death.f+1);msg=`Damage at 0 HP: death save failure (${S.death.f}/3). `;}
 const over=rem-prev;S.hp=Math.max(0,prev-rem);
 if(S.conc&&rem>0)msg+=`Concentration on ${S.conc}: CON save DC ${Math.max(10,Math.floor(a/2))}${S.feats.some(f=>/war caster/i.test(f.name))?' (advantage, War Caster)':''}. `;
 if(S.hp===0&&prev>0){
  if(over>=C.maxHP){commit();toast('Massive damage: instant death.');return;}
  const canGrave=C.sorc>=1&&!S.used.grave&&!special;
  if(canGrave){const dc=5+a;commit();if(msg)toast(msg);
   modal('Strength of the Grave',`<p>You drop to 0 HP. Make a CHA save, DC <b>${dc}</b> (5 + ${a} damage). On a success you stay at 1 HP instead.</p>`,[{label:'Failed',fn(){S.death={s:0,f:0};commit();}},{label:'Succeeded: 1 HP',cls:'gold',fn(){S.hp=1;S.used.grave=1;commit();}}]);
   return;}
  S.death={s:0,f:0};msg+='You are at 0 HP.';
 }
 commit();if(msg)toast(msg);
}
function longRest(){
 S.hp=C.maxHP;S.temp=0;S.death={s:0,f:0};S.conc='';S.shieldSpell=false;S.mageArmor=false;
 S.used.slots={};S.used.pact=0;S.used.sp=0;S.used.curse=0;S.used.grave=0;S.extra={};
 let regain=Math.max(1,Math.floor(C.L/2));
 [8,6].forEach(d=>{const k='hd'+d;const take=Math.min(regain,S.used[k]||0);S.used[k]=(S.used[k]||0)-take;regain-=take;});
 toast('Long rest done');commit();
}

/* ============ events ============ */
document.addEventListener('click',e=>{
 const mb=e.target.closest('[data-mbtn]');
 if(mb&&MODAL){const b=MODAL.buttons[mb.dataset.mbtn];
  if(MODAL.flex){flexAct(mb.dataset.mbtn);return;}
  if(b){const cur=MODAL;const r=b.fn?b.fn():undefined;if(r!==false&&MODAL===cur)closeModal();}return;}
 const el=e.target.closest('[data-act]');if(!el)return;
 const f=el.dataset.act==='closeModal'?ACT.closeModal:ACT[el.dataset.act];if(f)f(el);
});
function flexAct(code){
 if(!/^[csp]/.test(code)){closeModal();return;}
 const t=code[0],n=+code.slice(1);
 if(t==='c'){const cost=FLEX_COST[n];if(C.spMax-S.used.sp<cost){toast('Not enough sorcery points');return;}S.used.sp+=cost;S.extra[n]=(S.extra[n]||0)+1;}
 else if(t==='s'){S.used.slots[n]=(S.used.slots[n]||0)+1;S.used.sp=Math.max(0,S.used.sp-n);}
 else if(code==='p'){S.used.pact++;S.used.sp=Math.max(0,S.used.sp-C.pact.l);}
 closeModal();commit();toast('Converted');
}
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='m_p'){const p=WPRESET[t.value];if(p){$('#m_n').value=p.name;$('#m_d').value=p.dmg;$('#m_t').value=p.type;$('#m_k').value=p.kind;$('#m_f').checked=p.finesse;$('#m_2').checked=p.twoH;}return;}
 if(t.id==='importFile'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.levels))throw 0;S=migrate(merge(clone(DEFAULT),o));commit();toast('Backup imported');}catch(x){toast('Invalid backup file');}};r.readAsText(f);t.value='';return;}
 const b=t.dataset&&t.dataset.bind;if(!b)return;
 const path=b.split('.');let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];
 const last=path[path.length-1];
 let v=t.type==='checkbox'?t.checked:t.value;
 if(t.dataset.t==='n')v=num(v);else if(t.dataset.t==='nn')v=v===''?null:num(v);
 o[last]=v;commit();
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sid)UI.open[d.dataset.sid]=d.open;},true);
$('#themeBtn').addEventListener('click',()=>ACT.theme());
document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)&&!MODAL)document.body.classList.add('typing');});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName))document.body.classList.remove('typing');},50);});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
window.__sheet={get S(){return S;},get C(){return C;},ACT,recalc,render};
})();
</script>
</body>
